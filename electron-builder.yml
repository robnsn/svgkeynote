appId: com.svgkeynote.app
productName: SVG to Keynote
directories:
  buildResources: assets
  output: release

files:
  - dist/**/*
  - node_modules/**/*
  - package.json

mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  sign: false
  hardenedRuntime: false
  gatekeeperAssess: false
  defaultArch: arm64

dmg:
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
